name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (with diagnostics)
        run: |
          set -o pipefail
          {
            echo "=== ENV ==="
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "=== GRADLE VERSION ==="
            ./gradlew --version --no-daemon
            echo "=== BUILD ==="
            ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee gradle.log

      - name: Report build error as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token=os.environ['GH_TOKEN']; rid=os.environ['RUN_ID']
          try:
              log=open('gradle.log', encoding='utf-8', errors='ignore').read()
          except Exception as e:
              log="(no gradle.log) "+str(e)
          body="Run "+rid+" failed.\n\n```\n"+log[-9000:]+"\n```"
          data=json.dumps({"title":"CI build error "+rid,"body":body}).encode()
          req=urllib.request.Request("https://api.github.com/repos/xhx-hl/AudioPlayerApp/issues",
              data=data, headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  j=json.loads(r.read()); print("issue", j.get("html_url"))
          except urllib.error.HTTPError as e:
              print("issue create failed", e.code, e.read().decode()[:200])
          PY

      - name: Deliver APK via branch
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add app-debug.apk
          git commit -m "Deliver app-debug.apk" || echo "no change"
          git push "https://x-access-token:${{ github.token }}@github.com/xhx-hl/AudioPlayerApp.git" HEAD:apk --force
