name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (with diagnostics)
        run: |
          set -o pipefail
          chmod +x ./gradlew || true
          {
            echo "=== ENV ==="
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "=== FILE INFO ==="
            ls -la ./gradlew
            file ./gradlew
            head -c 40 ./gradlew | od -c | head -3
            echo "=== GRADLE VERSION ==="
            sh ./gradlew --version --no-daemon
            echo "=== BUILD ==="
            sh ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee gradle.log

      - name: Report build error (push log)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp gradle.log build-error.log
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add -f build-error.log
          git commit -m "build error log"
          git push "https://x-access-token:${GH_TOKEN}@github.com/xhx-hl/AudioPlayerApp.git" HEAD:build-log --force

      - name: Deliver APK via branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add -f app-debug.apk
          git commit -m "Deliver app-debug.apk"
          git push "https://x-access-token:${GH_TOKEN}@github.com/xhx-hl/AudioPlayerApp.git" HEAD:apk --force
